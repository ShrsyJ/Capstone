[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hookguard"
version = "0.1.0"
description = "Local-first, offline pre-commit reviewer: blocks hardcoded secrets and severe anti-patterns using regex/entropy checks plus a small local LLM (Ollama or llama.cpp)."
readme = "README.md"
requires-python = ">=3.9"
# Runtime is standard-library only, so the tool installs and runs fully offline.
# tomli is only needed to read .hookguard.toml on Python < 3.11.
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hookguard = "hookguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
